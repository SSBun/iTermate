name: iTermate
options:
  bundleIdPrefix: com.caishilin
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
targets:
  iTermate:
    type: application
    platform: macOS
    sources:
      - iTermate
      - path: iTermateBridge/iTermateBridge.py
        buildPhase: resources
      - path: integrations/laya/iTermate-laya.py
        buildPhase: resources
      - path: integrations/laya/agent-connection-prompt.md
        buildPhase: resources
      - path: integrations/pi/iTermate-integration.ts
        buildPhase: resources
      - path: integrations/status/iTermate-status.py
        buildPhase: resources
      - path: integrations/shell/iTermate.zsh
        buildPhase: resources
      - path: integrations/shell/iTermate.bash
        buildPhase: resources
      - path: integrations/shell/iTermate.fish
        buildPhase: resources
    resources:
      - iTermate/Assets.xcassets
    dependencies:
      - package: Sparkle
    info:
      path: iTermate/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSAppleEventsUsageDescription: Read and control terminal windows in iTerm2 and Ghostty.
        SUFeedURL: https://ssbun.github.io/iTermate/appcast.xml
        SUPublicEDKey: L5Q2dHra6pBCxeGReTg3uOslFt/VFO9QVbxM2aCB6XA=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caishilin.iTermate
        MARKETING_VERSION: 0.5.0
        CURRENT_PROJECT_VERSION: 12
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  iTermateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - iTermateTests
    dependencies:
      - target: iTermate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
