name: iTermate
options:
  bundleIdPrefix: com.caishilin
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  iTermate:
    type: application
    platform: macOS
    sources:
      - iTermate
      - path: iTermateBridge/iTermateBridge.py
        buildPhase: resources
      - path: integrations/pi/iTermate-integration.ts
        buildPhase: resources
      - path: integrations/codex/iTermate-hook.py
        buildPhase: resources
    resources:
      - iTermate/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caishilin.iTermate
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Start the iTermate Bridge inside iTerm2.
  iTermateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - iTermateTests
    dependencies:
      - target: iTermate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
