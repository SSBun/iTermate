name: iTermComrade
options:
  bundleIdPrefix: com.caishilin
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  iTermComrade:
    type: application
    platform: macOS
    sources:
      - iTermComrade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caishilin.iTermComrade
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
  iTermComradeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - iTermComradeTests
    dependencies:
      - target: iTermComrade
